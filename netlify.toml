# Netlify 自动化部署配置
# Moonlight-vplus 王冠模式编辑器

[build]
  command = "npm run build"
  publish = "dist"

# API 路由转发至 Netlify Functions (24小时短效直链)
[[redirects]]
  from = "/api/share/*"
  to = "/.netlify/functions/share"
  status = 200

[[redirects]]
  from = "/api/share"
  to = "/.netlify/functions/share"
  status = 200

# SPA 客户端回退
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
